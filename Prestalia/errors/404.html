<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="/photos/Gemini_Generated_Image.png" type="image/png">
  <title>Page introuvable — Prestalia</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; }
    .wrap {
      min-height: 100vh;
      background: #1a237e;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 2rem;
      position: relative; overflow: hidden;
    }
    canvas#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
    .content { position: relative; z-index: 2; }
    .num {
      font-size: 10rem; font-weight: 900; color: white;
      line-height: 1; margin: 0; letter-spacing: -6px;
      animation: float 3s ease-in-out infinite;
    }
    .num span { color: #db0f1d; display: inline-block; animation: spin 4s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
    @keyframes spin { 0%,100%{transform:rotate(-5deg) scale(1)} 50%{transform:rotate(5deg) scale(1.1)} }
    .tag {
      display: inline-block; background: rgba(100,181,246,0.2);
      border: 1px solid #64b5f6; color: #64b5f6;
      font-size: 0.75rem; letter-spacing: 3px; text-transform: uppercase;
      padding: 4px 16px; border-radius: 50px; margin-bottom: 1rem;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
    .title { font-size: 1.6rem; color: white; font-weight: 700; margin: 0.5rem 0 0.4rem; }
    .sub { font-size: 1rem; color: rgba(255,255,255,0.6); margin: 0 0 2rem; max-width: 360px; }
    .btn {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 0.85rem 2.2rem; background: white; color: #1a237e;
      border-radius: 50px; text-decoration: none; font-size: 1rem;
      font-weight: 700; transition: transform 0.2s;
    }
    .btn:hover { transform: scale(1.05); }
   
    @keyframes wobble { 0%,100%{transform:rotate(-8deg) translateY(0)} 50%{transform:rotate(8deg) translateY(-10px)} }
    .speech {
      position: fixed; top: 9%; right: 6%;
      background: white; color: #1a237e;
      font-size: 0.75rem; font-weight: 700;
      padding: 6px 12px; border-radius: 10px; z-index: 3;
      animation: wobble 2.5s ease-in-out infinite; white-space: nowrap;
    }
    .speech::after {
      content: ''; position: absolute; bottom: -8px; left: 14px;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 9px solid white;
    }
    /* .planet {
      position: fixed; border-radius: 50%; opacity: 0.12; background: #64b5f6;
    } */
  </style>
</head>
<body>
  <div class="wrap" id="wrap">
    <canvas id="bg"></canvas>
  
    <div class="content">
      <div class="tag">Erreur</div>
      <p class="num">4<span>0</span>4</p>
      <p class="title">Oups! on a un problème...</p>
      <p class="sub">Cette page est introuvable!</p>
      <a href="/" class="btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1a237e" stroke-width="2.5" stroke-linecap="round"><path d="M3 12L12 3l9 9"/><path d="M9 21V12h6v9"/></svg>
        Revenir à l'accueil
      </a>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('bg');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
    const stars = Array.from({length: 100}, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.8 + 0.3,
      t: Math.random() * Math.PI * 2
    }));
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(s => {
        s.t += 0.015;
        const a = (Math.sin(s.t) + 1) / 2 * 0.7 + 0.15;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        ctx.fill();
      });
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
