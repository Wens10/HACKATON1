<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceuil</title>
</head>
<body>
    <style>
        :root{
            --neon1: #3fffd6;
            --neon2: #7be0ff;
            --bg1: #020617;
        }

        html,body{
            height:100%;
            margin:0;
            background: radial-gradient(1200px 600px at 50% 40%, #04102a 0%, #000 60%), var(--bg1);
            font-family: "Segoe UI", Roboto, system-ui, -apple-system, "Helvetica Neue", Arial;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .hack{
            position:relative;
            font-size: clamp(48px, 12vw, 140px);
            font-weight:900;
            letter-spacing: .12em;
            text-transform:uppercase;
            padding: .25em .6em;
            color: var(--neon1);
            background: linear-gradient(90deg, #ffffff 0%, var(--neon1) 35%, var(--neon2) 65%, #cfefff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 8px 30px rgba(0,200,255,0.06));
            text-shadow:
                0 0 8px rgba(63,255,214,0.18),
                0 0 18px rgba(123,224,255,0.12),
                0 12px 40px rgba(0,0,0,0.6);
            transform-origin:center;
            animation: appear 900ms cubic-bezier(.16,.9,.29,1) both, slowFlicker 3.5s infinite;
            transition: transform 300ms ease, text-shadow 300ms ease, filter 300ms ease;
            cursor:default;
        }

        /* futuristic scanline on hover */
        .hack::after{
            content:"";
            position:absolute;
            left:-120%;
            top:0;
            width:60%;
            height:100%;
            pointer-events:none;
            transform: skewX(-20deg);
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.85) 50%, transparent 100%);
            opacity:0;
        }

        .hack:hover{
            transform: scale(1.05) rotate(-0.6deg);
            text-shadow:
                0 0 12px rgba(63,255,214,0.28),
                0 0 30px rgba(123,224,255,0.22),
                0 18px 50px rgba(0,0,0,0.7);
            filter: drop-shadow(0 18px 40px rgba(0,200,255,0.08));
        }

        .hack:hover::after{
            animation: shine 900ms forwards;
            opacity:1;
        }

        @keyframes appear{
            0% { opacity:0; transform: translateY(18px) scale(.88); filter: blur(8px); }
            60% { opacity:1; transform: translateY(-6px) scale(1.02); filter: blur(0); }
            100% { opacity:1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        @keyframes slowFlicker{
            0% { opacity:1; }
            50% { opacity:.96; text-shadow: 0 0 6px rgba(63,255,214,0.16); }
            100% { opacity:1; }
        }

        @keyframes shine{
            0% { left:-120%; opacity:0; }
            30% { opacity:1; }
            100% { left:140%; opacity:0; }
        }

        /* Respect user preference */
        @media (prefers-reduced-motion: reduce) {
            .hack, .hack::after { animation: none !important; transition: none !important; }
        }
    </style>

    <h1 class="hack">HACKATON</h1>
</body>
</html>
